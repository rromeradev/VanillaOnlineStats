name: Plugin and contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://vos:vos-test-only@127.0.0.1:5432/vos_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vos
          POSTGRES_PASSWORD: vos-test-only
          POSTGRES_DB: vos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vos -d vos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        working-directory: plugin
        run: bash gradlew --no-daemon clean build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install and test API
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -r test
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-plugin-test.txt
      - run: python packages/api-contracts/test_contract.py
      - name: Download verified smoke-test dependencies
        shell: bash
        run: |
          mkdir -p .tools
          curl --fail --location --retry 3 -o .tools/paper.jar https://fill-data.papermc.io/v1/objects/416b7d105b1d0192df4afa4b29d2800d9dbeda092a82fbc5b511248a54adde15/paper-26.3-227.jar
          curl --fail --location --retry 3 -o .tools/authme.jar https://github.com/AuthMe/AuthMeReloaded/releases/download/6.0.1/AuthMe-6.0.1-Paper.jar
          echo '416b7d105b1d0192df4afa4b29d2800d9dbeda092a82fbc5b511248a54adde15  .tools/paper.jar' | sha256sum -c -
          echo '7704335e9e73a634d9d926344f77897f4c74f78f82453a59f5aa0f8d2722450a  .tools/authme.jar' | sha256sum -c -
      - name: Smoke test with and without AuthMe
        run: >-
          python scripts/smoke_server.py --java "$JAVA_HOME/bin/java"
          --paper .tools/paper.jar --authme .tools/authme.jar
          --plugin plugin/build/libs/VanillaOnlineStats-0.3.2.jar
          --output .tools/smoke --heartbeat --accept-eula
      - name: Release protocol integration (Paper, batches and signed controls)
        run: >-
          python scripts/smoke_release.py --java "$JAVA_HOME/bin/java"
          --paper .tools/paper.jar --authme .tools/authme.jar
          --plugin plugin/build/libs/VanillaOnlineStats-0.3.2.jar
          --output .tools/release-smoke --cache .tools/smoke/with-authme --accept-eula
      - name: Real platform integration (Paper, API, PostgreSQL)
        run: >-
          node scripts/smoke_platform.mjs --java "$JAVA_HOME/bin/java"
          --paper .tools/paper.jar --authme .tools/authme.jar
          --plugin plugin/build/libs/VanillaOnlineStats-0.3.2.jar
          --output .tools/platform-smoke --cache .tools/smoke/with-authme --accept-eula
      - name: Package plugin release
        run: python scripts/package_plugin.py --version 0.3.2
      - name: Package platform release
        run: |
          pnpm licenses list --prod --json > .tools/licenses.json
          python scripts/package_platform.py --licenses .tools/licenses.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: plugin-and-test-results
          path: |
            plugin/build/libs/*.jar
            plugin/build/reports/tests/
            plugin/build/release/
            dist/
            .tools/smoke/*/console.log
            .tools/smoke/*/api.log
            .tools/release-smoke/console.log
            .tools/release-smoke/results.txt
            .tools/release-smoke/control-responses.json
            .tools/platform-smoke/console.log
            .tools/platform-smoke/results.txt
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Test automatic identity provisioning
        run: node --test scripts/runtime.test.mjs
      - name: Deploy complete Coolify Compose stack
        run: |
          node scripts/compose-test-env.mjs
          docker compose --env-file .env.ci -p vos-ci config --quiet
          docker compose --env-file .env.ci -p vos-ci up -d --build --wait
          docker compose --env-file .env.ci -p vos-ci exec -T portal node scripts/check-deployment.mjs
      - name: Verify identity survives container recreation
        run: |
          before=$(docker compose --env-file .env.ci -p vos-ci exec -T portal sha256sum /app/state/identity.json)
          docker compose --env-file .env.ci -p vos-ci up -d --no-deps --force-recreate --wait portal
          after=$(docker compose --env-file .env.ci -p vos-ci exec -T portal sha256sum /app/state/identity.json)
          test "$before" = "$after"
          docker compose --env-file .env.ci -p vos-ci exec -T portal node scripts/check-deployment.mjs
      - name: Stop disposable installation
        if: always()
        run: |
          if [ -f .env.ci ]; then docker compose --env-file .env.ci -p vos-ci down --volumes; fi
