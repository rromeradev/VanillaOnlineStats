name: VanillaOnlineStats
main: dev.vanillaonlinestats.plugin.VanillaOnlineStatsPlugin
version: '${version}'
api-version: '26.3'
load: POSTWORLD
depend: [AuthMe]
softdepend: [LuckPerms, Vault, PlaceholderAPI, SkinsRestorer]
commands:
  vos:
    description: Estado local do VanillaOnlineStats
    usage: /vos <status|collectors|capabilities|queue|query|link>
permissions:
  vanillaonlinestats.status:
    description: Consultar estado local do plugin
    default: op
